[package]
name = "hydra-umc-hil-bridge"
version = "0.0.3"
edition = "2021"
description = "Hardware-in-the-loop interface for real-vs-virtual command syncing between HYDRA-UMC controllers and HYDRA-UMC-TWIN."
authors = ["JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"

# Bootstrap stage; real service dependencies are added with their implementation.
# No external crates yet on purpose: this binary only prints its identity
# and exits, so `cargo build` stays fast and dependency-free while the
# project remains fast and dependency-free during its bootstrap phase.
# Planned once real business logic lands: tonic/prost (gRPC for high-speed
# local sync with HYDRA-UMC-TWIN), tokio-tungstenite (WebSocket for remote
# monitoring), and serde for joint-state message framing.
[dependencies]
